# ════════════════════════════════════════════════════════════════════
#  Monebra Perfume — إعداد Nginx
#
#  انسخه إلى:  /etc/nginx/sites-available/monebra
#  ثم فعّله:   sudo ln -s /etc/nginx/sites-available/monebra \
#                          /etc/nginx/sites-enabled/monebra
#              sudo nginx -t && sudo systemctl reload nginx
#
#  استبدل monebra.ly بنطاقك في السطرين أدناه.
#
#  هذا الملف للمنفذ 80 فقط. عند تشغيل certbot سيعيد كتابته تلقائيًا
#  ليضيف شهادة HTTPS وتحويل 80 ← 443. لا تكتب إعداد TLS يدويًا.
# ════════════════════════════════════════════════════════════════════

server {
    listen 80;
    listen [::]:80;

    server_name monebra.ly www.monebra.ly;

    # ⚠️ رفع صور المنتجات يقبل حتى ٨ ميجابايت (MAX_UPLOAD_BYTES في
    # src/lib/storage.ts). حدّ Nginx الافتراضي ١ ميجابايت، فبدون هذا
    # السطر يفشل رفع أي صورة أكبر بخطأ 413 — والرسالة تظهر من Nginx لا
    # من المتجر، فيصعب تفسيرها.
    client_max_body_size 10M;

    # الضغط — أثره كبير على HTML وJS في شبكات ضعيفة
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # ⚠️ أهم ثلاثة أسطر في الملف. تحديد المعدّل وسجلّ محاولات الدخول
        # يقرآن عنوان الزائر من `x-forwarded-for` ثم `x-real-ip`
        # (src/lib/rate-limit.ts و src/lib/auth.ts). بدونها يبدو كل
        # الزوار بعنوان الخادم نفسه — فأول خمسة طلبات تستهلك الحصة
        # ويُحظر بقية العملاء جميعًا.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        proxy_read_timeout 60s;
    }

    # ملفات Next الثابتة — اسمها يحمل بصمة المحتوى، فتخزينها سنة آمن
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # صور المنتجات المرفوعة من لوحة التحكم
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=2592000";
    }
}
